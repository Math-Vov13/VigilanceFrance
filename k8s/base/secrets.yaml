apiVersion: v1
kind: Secret
metadata:
  name: vigilance-secrets
  namespace: vigilance-france
type: Opaque
stringData:
  # MongoDB Password
  MONGO_PASSWORD: "your_mongo_password_here"

  # Redis Password (optional)
  REDIS_PASSWORD: ""
  REDIS_PSWD: ""

  # JWT Secrets
  JWT_SECRET: "your_jwt_secret_key_here"
  JWT_REFRESH_SECRET: "your_jwt_refresh_secret_key_here"

  # OAuth Credentials - Google
  GOOGLE_CLIENT_ID: "your_google_client_id_here"
  GOOGLE_CLIENT_SECRET: "your_google_client_secret_here"

  # OAuth Credentials - GitHub
  GITHUB_CLIENT_ID: "your_github_client_id_here"
  GITHUB_CLIENT_SECRET: "your_github_client_secret_here"

  # Google Maps API Key
  GOOGLE_MAPS_API_KEY: "your_google_maps_api_key_here"

---
# Note: Dans un environnement de production, utilisez:
# kubectl create secret generic vigilance-secrets \
#   --from-literal=MONGO_PASSWORD='...' \
#   --from-literal=JWT_SECRET='...' \
#   --namespace=vigilance-france
