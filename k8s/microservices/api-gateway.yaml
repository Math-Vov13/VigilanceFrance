---
# API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: vigilance-france
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: vigilance/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: NODE_ENV
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vigilance-secrets
              key: REDIS_PASSWORD
        - name: REDIS_PSWD
          valueFrom:
            secretKeyRef:
              name: vigilance-secrets
              key: REDIS_PSWD
        - name: REDIS_SESSION_SECRET
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: REDIS_SESSION_SECRET
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: AUTH_SERVICE_URL
        - name: MAPS_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: MAPS_SERVICE_URL
        - name: MESS_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: MESS_SERVICE_URL
        - name: NOTIFS_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: NOTIFS_SERVICE_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3

---
# API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: vigilance-france
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  sessionAffinity: ClientIP  # Important pour les sessions
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: api-gateway
