---
# Notifications Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifs-service
  namespace: vigilance-france
  labels:
    app: notifs-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifs-service
  template:
    metadata:
      labels:
        app: notifs-service
    spec:
      containers:
      - name: notifs-service
        image: vigilance/notifs-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PORT
          value: "80"
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: NODE_ENV
        - name: MONGO_HOST
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: MONGO_HOST
        - name: MONGO_PORT
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: MONGO_PORT
        - name: MONGO_DB
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: MONGO_DB
        - name: MONGO_USER
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: MONGO_USER
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vigilance-secrets
              key: MONGO_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: vigilance-config
              key: REDIS_PORT
        - name: REDIS_PSWD
          valueFrom:
            secretKeyRef:
              name: vigilance-secrets
              key: REDIS_PSWD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3

---
# Notifications Service
apiVersion: v1
kind: Service
metadata:
  name: notifs-service
  namespace: vigilance-france
  labels:
    app: notifs-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: notifs-service
